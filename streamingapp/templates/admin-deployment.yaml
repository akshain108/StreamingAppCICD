apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.services.admin.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: admin

  template:
    metadata:
      labels:
        app: admin

    spec:
      containers:
        - name: admin
          image: "{{ .Values.services.admin.image }}:{{ .Values.services.admin.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}

          ports:
            - containerPort: 3003
              name: http

          env:
            - name: PORT
              value: "3003"

            - name: MONGO_URI
              value: "mongodb://mongo:27017/{{ .Values.config.mongoDatabase }}"

            - name: MONGO_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: MONGO_DB

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: JWT_SECRET

            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: AWS_REGION

            - name: CLIENT_URLS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: CLIENT_URLS

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: AWS_SECRET_ACCESS_KEY

            - name: AWS_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: AWS_S3_BUCKET

            - name: AWS_CDN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: AWS_CDN_URL

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi